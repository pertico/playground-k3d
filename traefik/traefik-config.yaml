apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    api:
      dashboard: true
      insecure: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
        - websecure
        matchRule: Host(`traefik.localhost`)
        tls:
          secretName: traefik-custom-cert
    logs:
      access:
        enabled: true