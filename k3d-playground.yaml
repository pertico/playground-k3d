# k3d configuration file
apiVersion: k3d.io/v1alpha5 # this will change in the future as we make everything more stable
kind: Simple # internally, we also have a Cluster config, which is not yet available externally
metadata:
  name: playground # name that you want to give to your cluster (will still be prefixed with `k3d-`)
image: rancher/k3s:v1.37.2-k3s1 # same as `--image rancher/k3s:v1.20.4-k3s1`  
servers: 1 # same as `--servers 1`
agents: 2 # same as `--agents 2`
kubeAPI: # same as `--api-port 127.0.0.1:6443` (where the name would resolve to 127.0.0.1)
  host: "127.0.0.1" # important for the `server` setting in the kubeconfig
  hostIP: "127.0.0.1" # where the Kubernetes API will be listening on
  hostPort: "6443" # where the Kubernetes API listening port will be mapped to on your host system
ports:
  - port: 127.0.0.1:80:80 # same as `--port '127.0.0.1:443:443@loadbalancer'`
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:443:443 # same as `--port '127.0.0.1:443:443@loadbalancer'`
    nodeFilters:
      - loadbalancer  
volumes: # repeatable flags are represented as YAML lists
  - volume: ${PWD}/traefik/traefik-config.yaml:/var/lib/rancher/k3s/server/manifests/traefik-config.yaml:ro
    nodeFilters:
      - server:*
  - volume: /etc/ssl/certs:/etc/ssl/certs:ro # same as `--volume '/my/host/path:/path/in/node@server:0;agent:*'`
    nodeFilters:
      - server:*
      - agent:*      